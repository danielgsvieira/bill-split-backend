services:

  db:
    image: postgres:17.5-alpine
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: divisao-contas
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgressql/data
